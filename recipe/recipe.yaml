schema_version: 1

context:
  name: sty
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/feluxe/sty/archive/refs/tags/${{ version }}-rc.2.tar.gz
  sha256: 9b18f272adac3778d6157249a50c756b0d65878e2ccd80a151ccd0087fafea92

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - toml
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - sty
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: String styling for your terminal.
  description: |
    Sty's goal is to provide Python with a simple, customizable and
    performant string styling markup, which is decoupled from color
    palettes and terminal implementations.
  homepage: https://sty.mewo.dev/
  repository: https://github.com/feluxe/sty
  documentation: https://sty.mewo.dev

extra:
  recipe-maintainers:
    - jan-janssen
